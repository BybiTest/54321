name: Build Cafe Bazaar Release (AAB & APK)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release AAB & APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradlew Executable and Ensure Wrapper
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "gradle-wrapper.jar missing. Downloading Gradle wrapper..."
            mkdir -p gradle/wrapper
            curl -sSL "https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Prepare Release Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using release keystore provided in GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore
          else
            echo "No custom keystore found in secrets. Generating standard release keystore..."
            keytool -genkeypair -v -keystore release.keystore -alias "${{ secrets.KEY_ALIAS || 'bazaarkey' }}" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${{ secrets.KEYSTORE_PASSWORD || 'bazaar123456' }}" \
              -keypass "${{ secrets.KEY_PASSWORD || 'bazaar123456' }}" \
              -dname "CN=KalamePich, OU=Games, O=KalamePich, L=Tehran, ST=Tehran, C=IR"
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Release Bundle (AAB for Cafe Bazaar)
        run: ./gradlew bundleRelease --stacktrace --no-daemon
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'bazaar123456' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'bazaarkey' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'bazaar123456' }}

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'bazaar123456' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'bazaarkey' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'bazaar123456' }}

      - name: Prepare Artifacts for Cafe Bazaar
        run: |
          mkdir -p output_bazaar
          # Copy Release AAB (Recommended format for publishing on Cafe Bazaar)
          find app/build/outputs/bundle/release -name "*.aab" -exec cp {} output_bazaar/KalamePich-Release.aab \; || true
          # Copy Release APK
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} output_bazaar/KalamePich-Release.apk \; || true
          echo "Output files ready for Cafe Bazaar:"
          ls -la output_bazaar/

      - name: Upload Cafe Bazaar Bundle (AAB - Recommended)
        uses: actions/upload-artifact@v4
        with:
          name: CafeBazaar-AAB-Bundle
          path: output_bazaar/*.aab
          if-no-files-found: error

      - name: Upload Cafe Bazaar Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: CafeBazaar-Signed-APK
          path: output_bazaar/*.apk
          if-no-files-found: error
